<script>const SITE_URL="index.html",SETTINGS_URL="settings.json"; /* the public page and the published settings file */

currency:"$",logo:"",showName:true,logoH:32,endpoint:"",pay:"",policy:"Cancel at least 24 hours before your session for a full refund.",blockedDates:"",audio:[{t:"Sample track 1",u:""},{t:"Sample track 2",u:""}],quotes:[],faq:[{q:"Do I need to bring anything?",a:"Bring your lyrics, instruments and any reference tracks."},{q:"How do I pay?",a:"A deposit holds your slot and the rest is paid on the day."}],contact:{address:"",phone:"",email:"",whatsapp:"",hours:"",map:""},

/* ===== OPTIONAL LIVE BACKEND (Supabase) =====

   Leave both empty to run without any backend. */
const BACKEND={url:"",key:""};
const sb=()=>BACKEND.url&&BACKEND.key;
let tok=null,RB=null,TK=[];
const H=a=>({apikey:BACKEND.key,Authorization:"Bearer "+(a&&tok?tok:BACKEND.key),"Content-Type":"application/json"});
async function sbLogin(email,password){try{const r=await fetch(BACKEND.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:BACKEND.key,"Content-Type":"application/json"},body:JSON.stringify({email,password})});if(!r.ok)return false;tok=(await r.json()).access_token;return true}catch(e){return false}}

async function loadRB(){try{const r=await fetch(BACKEND.url+"/rest/v1/bookings?select=*&order=created_at.desc",{headers:H(1)});RB=r.ok?await r.json():null}catch(e){RB=null}}
async function pushSettings(){try{const d=JSON.parse(JSON.stringify(S));delete d.password;const r=await fetch(BACKEND.url+"/rest/v1/settings",{method:"POST",headers:{...H(1),Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:1,data:d})});return r.ok}catch(e){return false}}
function loginModal(){return new Promise(res=>{
 const d=document.createElement("div");d.className="lgw";document.body.appendChild(d);
 const close=v=>{d.remove();res(v)};let fails=0,lock=0;
 
 const shell=h=>{d.innerHTML=`<div class="lgc" role="dialog" aria-modal="true"><div class="lgl">${S.logo?`<img src="${esc(S.logo)}" alt="" style="height:32px">`:logo}${esc(S.name)}</div>${h}<button type="button" class="lgx" aria-label="Close">✕</button></div>`;d.querySelector(".lgx").onclick=()=>close(false)};
 const err=m=>{d.querySelector(".err").textContent=m},busy=(b,on,t)=>{b.disabled=on;b.textContent=t};

 const code=(id,extra)=>{shell(`<h2>Two-step verification</h2><p>${extra?"Scan this QR code with an authenticator app such as Google Authenticator, Authy or 1Password, then enter the 6-digit code.":"Enter the 6-digit code from your authenticator app."}</p>${extra||""}<form><input class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required aria-label="6-digit code"><span class="err" role="alert"></span><button class="btn">Verify</button></form>`);
  const f=d.querySelector("form"),i=f.querySelector("input");i.focus();
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector(".btn");busy(b,1,"Checking…");
   const c=await api("/factors/"+id+"/challenge",{});const v=c.ok&&await api("/factors/"+id+"/verify",{challenge_id:c.j.id,code:i.value});

  if(!r.ok){step1();return err("Could not set up two-step verification.")}

 const mfa=async()=>{const u=await api("/user");const fa=(u.j.factors||[]).find(x=>x.factor_type==="totp"&&x.status==="verified");fa?code(fa.id):enroll()};
 const step1=()=>{shell(`<h2>Owner sign in</h2><p>${sb()?"Use the email and password for this studio.":"Enter the owner password."}</p><form>${sb()?`<label>Email</label><input type="email" autocomplete="username" required>`:""}<label>Password</label><div class="pw"><input type="password" autocomplete="current-password" required><button type="button" class="eye">Show</button></div><span class="err" role="alert"></span><button class="btn">Sign in</button></form>${sb()?"":`<p class="note">This lock is only a convenience. Connect the backend for a real login and two-step verification.</p>`}`);
  const f=d.querySelector("form"),ins=f.querySelectorAll("input"),pw=ins[ins.length-1],em=sb()?ins[0]:null,eye=f.querySelector(".eye");

 step1()})}
const PRESETS=[["Wave","#7B5CFF","#2DE2D0"],["Sunset","#FF5E7E","#FFB347"],["Ocean","#2F7BFF","#5FE0FF"],["Emerald","#1FBF75","#9BF0C2"],["Gold","#D4A94F","#F1E0B0"]];

let S=loadSettings();const $=s=>document.querySelector(s);
const get=(o,p)=>p.split(".").reduce((x,k)=>x&&x[k],o);

const SOC={instagram:["Instagram","https://instagram.com/"],tiktok:["TikTok","https://tiktok.com/@"],youtube:["YouTube","https://youtube.com/@"],x:["X","https://x.com/"],facebook:["Facebook","https://facebook.com/"],spotify:["Spotify","https://open.spotify.com/artist/"]};
const SLOTS=["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];


const logo=`<svg viewBox="0 0 30 22" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"><defs><linearGradient id="lg"><stop stop-color="#7B5CFF"/><stop offset="1" stop-color="#2DE2D0"/></linearGradient></defs><path d="M2 11h3M9 5v12M15 2v18M21 6v10M27 9v4"/></svg>`;
/* ===== 4. OWNER SIDE ===== */
const mo=$("#mo"),toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
let tab="Media",authed=false;
async function openAdmin(){if(!authed){if(!(await loginModal()))return;authed=true;if(!sb()){try{localStorage.setItem("kw_owner","1")}catch(e){}}}
 $("#adm").classList.add("show");drawAdmin()}
const fld=(l,p,t="text")=>`<div><label>${l}</label><input type="${t}" data-p="${p}" value="${esc(get(S,p)??"")}"></div>`;
function drawAdmin(){
 $("#tabs").innerHTML=`<h3 style="padding:.5rem .9rem 1rem;font-size:1rem">${esc(S.name)} Owner</h3>`+["Media","Content","Pricing","Contact","Extras","Bookings","Theme","Publish"].map(t=>`<button class="${t===tab?"on":""}" data-t="${t}">${t}</button>`).join("")+`<button data-t="exit" style="margin-top:auto">Log out</button>`;
 let h=`<h2>${tab}</h2>`;
 if(tab==="Media")h+=`<p style="margin:.4rem 0">Only the hero, studio tour and booking sections use media backgrounds. Paste a link or upload a file. Large videos should be hosted online and pasted as a link, because browser storage is small.</p>`+[["hero","Hero (top of site)"],["tour","Studio tour"],["booking","Booking section"]].map(([k,l])=>`<div class="ar"><h3>${l}</h3><div><label>Type</label><select data-p="media.${k}.type"><option value="image"${S.media[k].type==="image"?" selected":""}>Image</option><option value="video"${S.media[k].type==="video"?" selected":""}>Video</option></select></div>${fld("Link (URL)","media."+k+".src")}${fld("Video poster image link","media."+k+".poster")}<div><label>Or upload a file</label><input type="file" accept="image/*,video/*" data-up="${k}"></div><div><button class="btn g" data-clr="${k}">Reset to default</button></div></div>`).join("");
 if(tab==="Content")h+=`<div class="ar"><h3>Basics</h3>${fld("Studio name","name")}${fld("Tagline","tagline")}<div style="grid-column:1/-1"><label>About text</label><textarea rows="3" data-p="about">${esc(S.about)}</textarea></div></div><div class="ar"><h3>Stats (number, label)</h3>${S.stats.map((s,i)=>fld("Number","stats."+i+".0")+fld("Label","stats."+i+".1")).join("")}</div><div class="ar"><h3>Services</h3></div>`+S.services.map((s,i)=>`<div class="ar">${fld("Name","services."+i+".n")}${fld("Description","services."+i+".d")}${fld("Price per hour","services."+i+".p")}<div><button class="btn g" data-del="${i}">Delete</button></div></div>`).join("")+`<button class="btn g" id="addsv">Add a service</button>`;
 if(tab==="Pricing")h+=`<div class="ar"><h3>Currency</h3>${fld("Symbol","currency")}</div>`+S.tiers.map((t,i)=>`<div class="ar"><h3>Tier ${i+1}</h3>${fld("Name","tiers."+i+".n")}${fld("Price","tiers."+i+".p")}${fld("Unit text","tiers."+i+".u")}${fld("Features (comma separated)","tiers."+i+".f")}<div><label>Most popular</label><select data-p="tiers.${i}.pop"><option value="false">No</option><option value="true"${t.pop?" selected":""}>Yes</option></select></div></div>`).join("")+`<p>Hourly rates used by the booking estimate are edited under Content, in Services.</p>`;
 if(tab==="Contact")h+=`<div class="ar"><h3>Location and contact</h3>${fld("Address","contact.address")}${fld("Map link","contact.map")}${fld("Phone","contact.phone")}${fld("Email","contact.email")}${fld("WhatsApp number (with country code)","contact.whatsapp")}${fld("Opening hours","contact.hours")}</div><div class="ar"><h3>Booking delivery (no database needed)</h3>${fld("Form endpoint link (Formspree or Web3Forms)","endpoint")}<p style="grid-column:1/-1">Paste a free Formspree or Web3Forms link and every booking is emailed to you automatically. Leave it empty and visitors will send their request to your WhatsApp or email with one tap.</p></div><div class="ar"><h3>Social handles or links</h3>${Object.keys(SOC).map(k=>fld(SOC[k][0],"social."+k)).join("")}</div><p>Empty fields stay hidden on the public site.</p>`;
 if(tab==="Extras"){const LS=(k,t,fs)=>`<div class="ar"><h3>${t}</h3></div>`+S[k].map((x,i)=>`<div class="ar">${fs.map(f=>fld(f[0],k+"."+i+"."+f[1])).join("")}<div><button class="btn g" data-dl="${k}:${i}">Delete</button></div></div>`).join("")+`<button class="btn g" data-ad="${k}">Add</button>`;
  h+=LS("audio","Music showcase (link to an MP3 or audio file)",[["Track title","t"],["Audio link","u"]])+LS("quotes","Testimonials",[["Artist name","n"],["Quote","t"]])+LS("faq","FAQ",[["Question","q"],["Answer","a"]])}
 if(tab==="Publish")h+=`<div class="ar"><h3>Make your changes live for every visitor</h3><p style="grid-column:1/-1">1. Click Download settings.json. 2. Upload that file to your hosting, in the same folder as index.html, named exactly settings.json. 3. Refresh the site. Until then your edits show only in this browser. Host your images, videos and audio in a media folder and paste their paths (for example media/hero.jpg) rather than uploading, so the file stays small. The password is stored in this file, so use one you use nowhere else.</p><div><button class="btn" id="ex2">Download settings.json</button></div></div>`;
 if(tab==="Bookings"){const L=tok&&RB?RB:JSON.parse(localStorage.getItem("kw_bookings")||"[]");
  h+=`<div class="ar"><h3>Block time slots (comma separated, e.g. 12:00,15:00)</h3>${fld("Blocked slots","blocked")}${fld("Blocked dates (YYYY-MM-DD, comma separated)","blockedDates")}${fld("Deposit or payment link","pay")}${fld("Cancellation policy","policy")}</div>`+(L.length?L.map((b,i)=>`<div class="ar"><div><b>${esc(b.name)}</b><br>${esc(b.service)}<br>${esc(b.date)} ${esc(b.time)}, ${esc(b.hours)} hr</div><div>${esc(b.email)}<br>${esc(b.phone)}<br>${S.currency}${esc(b.total)}</div><div><label>Status</label><select data-bs="${i}">${["new","confirmed","cancelled"].map(s=>`<option${b.status===s?" selected":""}>${s}</option>`).join("")}</select></div></div>`).join(""):`<p>No bookings yet.</p>`)}
 if(tab==="Theme")h+=`<div class="ar"><h3>Logo</h3>${fld("Logo link (URL)","logo")}${fld("Logo height (pixels)","logoH","number")}<div><label>Show studio name beside logo</label><select data-p="showName"><option value="true">Yes</option><option value="false"${S.showName===false?" selected":""}>No</option></select></div><div><label>Or upload a logo</label><input type="file" accept="image/*" data-logo="1"></div><div><button class="btn g" data-nologo="1">Use default logo</button></div></div><div class="ar"><h3>Color presets</h3>${PRESETS.map((p,i)=>`<div><button class="btn" data-pre="${i}" style="background:linear-gradient(100deg,${p[1]},${p[2]});width:100%">${p[0]}</button></div>`).join("")}</div><div class="ar"><h3>Custom colors and access</h3><div><label>Primary</label><input type="color" data-p="v" value="${S.v}"></div><div><label>Secondary</label><input type="color" data-p="a" value="${S.a}"></div>${fld("Owner password","password")}</div>`;
 h+=`<div class="bar"><button class="btn" id="sv2">Save changes</button><button class="btn g" id="pv">Preview site</button><button class="btn g" id="ex">Export JSON</button><label class="btn g" style="margin:0">Import<input type="file" id="im" accept=".json" hidden></label><button class="btn g" id="rs">Reset all</button></div>`;
 $("#pane").innerHTML=h}
$("#adm").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.t){if(t.dataset.t==="exit"){location.reload();return}tab=t.dataset.t;if(tab==="Bookings"&&tok)loadRB().then(drawAdmin);else drawAdmin()}
 if(t.dataset.clr){S.media[t.dataset.clr]={type:DEFAULTS.media[t.dataset.clr].type,src:"",poster:""};drawAdmin()}
 if(t.dataset.del){S.services.splice(+t.dataset.del,1);drawAdmin()}
 if(t.dataset.pre){const p=PRESETS[+t.dataset.pre];S.v=p[1];S.a=p[2];document.documentElement.style.setProperty("--v",S.v);document.documentElement.style.setProperty("--a",S.a);drawAdmin()}
 if(t.dataset.nologo){S.logo="";drawAdmin()}
 if(t.dataset.dl){const[k,i]=t.dataset.dl.split(":");S[k].splice(+i,1);drawAdmin()}
 if(t.dataset.ad){S[t.dataset.ad].push({audio:{t:"New track",u:""},quotes:{n:"Artist name",t:"Quote"},faq:{q:"Question",a:"Answer"}}[t.dataset.ad]);drawAdmin()}
 if(t.id==="addsv"){S.services.push({n:"New service",d:"Describe it here.",p:30});drawAdmin()}
 if(t.id==="sv2"){const ok=saveSettings(S);if(tok)pushSettings().then(r=>toast(r?"Saved and live for every visitor":"Saved here, but the live update failed"));else toast(ok?"Saved on this browser":"Storage is full. Use a link for large media.")}
 if(t.id==="pv"){saveSettings(S);window.open(SITE_URL,"_blank")}
 if(t.id==="ex"||t.id==="ex2"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="settings.json";a.click()}
 if(t.id==="rs"&&confirm("Reset everything to defaults?")){S=clone(DEFAULTS);saveSettings(S);drawAdmin()}});
$("#adm").addEventListener("input",e=>{const el=e.target,p=el.dataset.p;if(p){let v=el.value;if(v==="true")v=true;if(v==="false")v=false;set(S,p,v)}
 if(el.dataset.bs!==undefined){if(tok&&RB){RB[el.dataset.bs].status=el.value;fetch(BACKEND.url+"/rest/v1/bookings?id=eq."+RB[el.dataset.bs].id,{method:"PATCH",headers:{...H(1),Prefer:"return=minimal"},body:JSON.stringify({status:el.value})})}else{const L=JSON.parse(localStorage.getItem("kw_bookings")||"[]");L[el.dataset.bs].status=el.value;localStorage.setItem("kw_bookings",JSON.stringify(L))}}});
$("#adm").addEventListener("change",e=>{const el=e.target;
 if(el.dataset.logo){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;if(!saveSettings(S))toast("Logo too large. Use a link instead.");else toast("Logo updated");drawAdmin()};r.readAsDataURL(f)}
 if(el.dataset.up){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.media[el.dataset.up].src=r.result;S.media[el.dataset.up].type=f.type.startsWith("video")?"video":"image";if(!saveSettings(S))toast("File too large to store. Host it online and paste the link.");else toast("Uploaded");drawAdmin()};r.readAsDataURL(f)}
 if(el.id==="im"){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=merge(clone(DEFAULTS),JSON.parse(r.result));saveSettings(S);drawAdmin();toast("Imported")}catch(_){toast("Invalid file")}};r.readAsText(f)}});
/* On load: defaults, then the published settings.json, then this browser's draft, then the live database. Then ask for login. */
(async()=>{try{const r=await fetch(SETTINGS_URL,{cache:"no-store"});if(r.ok){const j=await r.json();S=merge(merge(clone(DEFAULTS),j),JSON.parse(localStorage.getItem("kw_settings")||"{}"))}}catch(e){}
 if(sb()){try{const r=await fetch(BACKEND.url+"/rest/v1/settings?id=eq.1&select=data",{headers:H()});const j=r.ok?await r.json():[];if(j[0]&&j[0].data)S=merge(S,j[0].data)}catch(e){}}
 while(!authed)await openAdmin()})();</script></body></html>
