</style></head><body>

async function submitBooking(b){
 const L=JSON.parse(localStorage.getItem("kw_bookings")||"[]");L.unshift(b);try{localStorage.setItem("kw_bookings",JSON.stringify(L))}catch(e){}
 if(sb()){const row={name:b.name,email:b.email,phone:b.phone,service:b.service,date:b.date,time:b.time,hours:+b.hours,notes:b.notes,total:b.total};const r=await fetch(BACKEND.url+"/rest/v1/bookings",{method:"POST",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify(row)});if(r.status===409)throw new Error("taken");if(!r.ok)throw new Error("failed");if(S.endpoint)fetch(S.endpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(b)}).catch(()=>{});return"sent"}

 const msg=`Booking request for ${S.name}\nName: ${b.name}\nPhone: ${b.phone}\nEmail: ${b.email}\nService: ${b.service}\nDate: ${b.date} at ${b.time}\nHours: ${b.hours}\nEstimate: ${S.currency}${b.total}\nNotes: ${b.notes||"-"}`;

let S=loadSettings();const $=s=>document.querySelector(s);

function render(){
 document.documentElement.style.setProperty("--v",S.v);document.documentElement.style.setProperty("--a",S.a);document.title=S.name+" Studio";

function initSite(){
 const nav=$("#nav"),lk=$("#lk"),bt=$("#bg");
 bt.onclick=()=>{const o=lk.classList.toggle("open");bt.textContent=o?"✕":"☰";bt.setAttribute("aria-expanded",o)};
 lk.querySelectorAll("a").forEach(a=>a.onclick=()=>{lk.classList.remove("open");bt.textContent="☰"});
 
 const sc=()=>nav.classList.toggle("s",scrollY>40);sc();addEventListener("scroll",sc,{passive:true});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add("in");
  e.target.querySelectorAll("[data-n]").forEach(n=>{const t=+n.dataset.n||0,s=performance.now();(function f(now){const p=Math.min((now-s)/1400,1);n.textContent=Math.round(t*(1-Math.pow(1-p,3)))+(t>=100?"+":"");if(p<1)requestAnimationFrame(f)})(s)});io.unobserve(e.target)}),{threshold:.2});
 document.querySelectorAll(".rv").forEach(e=>io.observe(e));
 const vo=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()));
 document.querySelectorAll(".bg video").forEach(v=>vo.observe(v));
 const ls=[...lk.querySelectorAll("a[href^='#']")];
 document.querySelectorAll("section[id]").forEach(s=>new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)ls.forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+s.id))}),{rootMargin:"-45% 0px -50% 0px"}).observe(s));
 waves();booking()}
/* Interactive wave canvas */
let raf;function waves(){cancelAnimationFrame(raf);const cv=$("#cv"),x=cv.getContext("2d");let W,H,mx=.5,my=.5,sm=.5;
 const rs=()=>{W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight};rs();addEventListener("resize",rs);
 const mv=e=>{const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;mx=(p.clientX-r.left)/r.width;my=(p.clientY-r.top)/r.height};
 addEventListener("pointermove",mv);addEventListener("touchmove",mv,{passive:true});
 const red=matchMedia("(prefers-reduced-motion:reduce)").matches;let t=0;
 const cols=[S.v,S.a,"#ffffff"];
 (function f(){t+=red?0:.012;sm+=(mx-sm)*.05;x.clearRect(0,0,W,H);
  for(let i=0;i<7;i++){x.beginPath();x.lineWidth=1.4;x.strokeStyle=cols[i%3];x.globalAlpha=.16+.5*(1-i/7)*(i%3===2?.3:1);
   for(let px=0;px<=W;px+=8){const n=px/W,amp=(24+i*10)*(1+Math.sin(n*3+t)*.4)*(.5+Math.abs(sm-n)*-1+1)*(1.2-my*.4);
    const y=H*.62+Math.sin(n*9+t*2+i*.6)*amp*Math.exp(-Math.pow((n-sm)*1.6,2))+Math.sin(n*3.5-t+i)*18;
    px?x.lineTo(px,y):x.moveTo(px,y)}x.stroke()}
  if(document.hidden||scrollY>innerHeight)raf=setTimeout(()=>raf=requestAnimationFrame(f),250);else raf=requestAnimationFrame(f)})()}

/* ===== 3. BOOKING ===== */
function booking(){let slot="";const dt=$("#dt");dt.min=dt.value=new Date().toISOString().slice(0,10);
 const bl=S.blocked.split(",").map(s=>s.trim());
 const paint=()=>{const day=TK.filter(x=>x.date===dt.value).map(x=>x.time);slot="";$("#sl").innerHTML=SLOTS.map(t=>`<button type="button" ${bl.includes(t)||day.includes(t)?"disabled":""}>${t}</button>`).join("")};
 paint();dt.addEventListener("change",paint);taken().then(r=>{if(r){TK=r;paint()}});
 $("#sl").onclick=e=>{if(e.target.tagName!=="BUTTON")return;document.querySelectorAll("#sl button").forEach(b=>b.classList.remove("on"));e.target.classList.add("on");slot=e.target.textContent;$("#se").textContent=""};
 const pr=()=>Math.max(1,+$("#hr").value||1)*(+S.services[$("#sv").value].p||0),up=()=>$("#es").textContent=S.currency+pr();
 $("#sv").oninput=$("#hr").oninput=up;up();
 $("#fm").onsubmit=async e=>{e.preventDefault();let ok=true;
  [["nm",v=>v.trim().length>1,"Enter your full name."],["em",v=>/^\S+@\S+\.\S+$/.test(v),"Enter a valid email."],["ph",v=>v.replace(/\D/g,"").length>=7,"Enter a phone number."],["dt",v=>!!v&&!S.blockedDates.split(",").map(s=>s.trim()).includes(v),"Choose an available date."]].forEach(([i,t,m])=>{const el=$("#"+i),bad=!t(el.value);el.parentElement.querySelector(".err").textContent=bad?m:"";if(bad)ok=false});
  if(!slot){$("#se").textContent="Pick a time slot.";ok=false}
  if(slot){const i=SLOTS.indexOf(slot),n=Math.max(1,+$("#hr").value||1),day=TK.filter(x=>x.date===dt.value).map(x=>x.time);for(let k=0;k<n;k++){const s=SLOTS[i+k];if(!s||bl.includes(s)||day.includes(s)){$("#se").textContent="That length runs into a taken or closed time. Choose fewer hours or another slot.";ok=false;break}}}
  if(!ok)return;
  const b={id:Date.now(),name:$("#nm").value,email:$("#em").value,phone:$("#ph").value,service:S.services[$("#sv").value].n,date:dt.value,time:slot,hours:$("#hr").value,notes:$("#nt").value,total:pr(),status:"new"};
  const btn=$("#sb");btn.disabled=true;btn.textContent="Sending…";
  try{const r=await submitBooking(b);$("#mh").textContent=r==="sent"?"Booking received":"One last step";$("#sum").textContent=r==="sent"?`${b.service} on ${b.date} at ${b.time} for ${b.hours} hr. Estimate ${S.currency}${b.total}. We will contact ${b.email} to confirm.`:"Your request has not reached the studio yet. Tap a button below to send it.";$("#mlk").innerHTML=(r==="sent"?"":r)+extras(b);$("#mo").classList.add("show");$("#fm").reset();dt.value=dt.min;slot="";document.querySelectorAll("#sl button").forEach(x=>x.classList.remove("on"));up()}catch(er){$("#se").textContent=er.message==="taken"?"Someone just booked that slot. Pick another time.":"Something went wrong. Try again.";taken().then(r=>{if(r)TK=r})}
  btn.disabled=false;btn.textContent="Request this session"}}

render()})();
